spring:
  application:
    name: shopmind-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/shopmind
    username: shopmind
    password: shopmind
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false


server:
  port: 8080

jwt:
  secret: your-secret-key-change-in-production
  expiration: 86400000